<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPA sin React</title>
    <link rel="stylesheet" href="/estilos.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <p class="marca">SPA sin React</p>
      <h1 id="titulo">Red de transporte</h1>
      <p>Un solo documento. JavaScript pinta cada vista.</p>
    </header>
    <main>
      <p class="contadores">
        Cargas de este documento en la pestaña: <strong id="cargas">—</strong><br />
        Vistas pintadas por JavaScript: <strong id="pintadas">0</strong><br />
        Peticiones de datos: <strong id="peticiones">0</strong>
      </p>
      <p class="recarga">
        <button type="button" id="recargar">Recargar datos</button>
        <span id="estado-datos" aria-live="polite"></span>
      </p>
      <div id="app"></div>
      <noscript><p>Esta página necesita JavaScript: sin él no hay nada que ver.</p></noscript>
    </main>
  </body>
</html>
