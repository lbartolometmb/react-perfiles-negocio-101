<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img">
<title>La misma idea de piezas y estado en cuatro superficies: navegador, Ionic, React Native y Electron.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="330" y="150" width="220" height="110" rx="16" fill="#d5e4f7" stroke="#2c5f94" stroke-width="2.5"/>
<text x="440" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e2430">Misma idea</text>
<text x="440" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a5f">piezas y estado</text>
<rect x="40" y="40" width="240" height="80" rx="12" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="160" y="74" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Navegador</text>
<text x="160" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">React en la web</text>
<rect x="600" y="40" width="240" height="80" rx="12" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="720" y="74" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Móvil empaquetado</text>
<text x="720" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Ionic</text>
<rect x="40" y="340" width="240" height="80" rx="12" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="160" y="374" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Móvil nativo</text>
<text x="160" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">React Native</text>
<rect x="600" y="340" width="240" height="80" rx="12" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="720" y="374" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Puesto de escritorio</text>
<text x="720" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Electron</text>
<line x1="280" y1="80" x2="340" y2="160" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<line x1="600" y1="80" x2="540" y2="160" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<line x1="280" y1="360" x2="340" y2="250" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<line x1="600" y1="360" x2="540" y2="250" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<text x="440" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Cambia la superficie, no la pregunta: ¿de qué dato sale esta caja?</text>
