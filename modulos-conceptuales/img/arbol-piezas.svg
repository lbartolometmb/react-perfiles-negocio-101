<text x="440" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">GrupoLinea y FilaLinea se repiten: dos modos, tres líneas, las mismas piezas.</text>
<text x="440" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">El rótulo METRO y la fila L2 no son dos diseños. Son la misma función con otros datos.</text>
