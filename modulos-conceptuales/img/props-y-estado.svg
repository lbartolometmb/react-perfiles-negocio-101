<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476" role="img">
<title>El panel recuerda el texto y la casilla. La búsqueda y la lista reciben props. La lista filtrada se calcula.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<text x="440" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">Lo que baja y lo que se recuerda</text>
<rect x="250" y="64" width="380" height="110" rx="14" fill="#e7e2d8" stroke="#6f675c" stroke-width="2"/>
<text x="440" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">PanelServicio recuerda</text>
<rect x="276" y="112" width="150" height="40" rx="8" fill="#fff" stroke="#8d6a12" stroke-width="1.5"/>
<text x="351" y="137" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e2430">texto: «L»</text>
<rect x="444" y="112" width="160" height="40" rx="8" fill="#fff" stroke="#8d6a12" stroke-width="1.5"/>
<text x="524" y="137" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e2430">casilla: no</text>
<line x1="360" y1="174" x2="250" y2="230" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<line x1="520" y1="174" x2="640" y2="230" stroke="#5c6b7a" stroke-width="2.2" marker-end="url(#arrSoft)"/>
<rect x="70" y="236" width="300" height="100" rx="12" fill="#d5e4f7" stroke="#2c5f94" stroke-width="2"/>
<text x="220" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">BarraBusqueda</text>
<text x="220" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e3a5f">recibe el texto</text>
<text x="220" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e3a5f">y avisa al escribir</text>
<rect x="510" y="236" width="300" height="100" rx="12" fill="#e3dcf5" stroke="#66558f" stroke-width="2"/>
<text x="660" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">ListaLineas</text>
<text x="660" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">recibe las líneas ya filtradas</text>
<text x="660" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">no guarda el filtro</text>
<rect x="70" y="370" width="740" height="78" rx="12" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="440" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Esas entradas se llaman props. El recuerdo del panel se llama estado.</text>
<text x="440" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">La lista filtrada no se guarda: se calcula con el texto, la casilla y las líneas.</text>
</svg>
