<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img">
<title>Cinco cualidades observables: mantenimiento, rendimiento, teléfono, acceso y seguridad.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<text x="440" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">Lo que se nota sin leer el código</text>
<rect x="40" y="70" width="800" height="48" rx="10" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="60" y="100" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Mantenible</text>
<text x="250" y="100" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">Un cambio de significado tiene un sitio.</text>
<rect x="40" y="128" width="800" height="48" rx="10" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="60" y="158" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Rendimiento</text>
<text x="250" y="158" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">Cambiar una fila no redibuja la ciudad.</text>
<rect x="40" y="186" width="800" height="48" rx="10" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="60" y="216" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Teléfono</text>
<text x="250" y="216" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">La decisión cabe en una mano.</text>
<rect x="40" y="244" width="800" height="48" rx="10" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="60" y="274" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Acceso</text>
<text x="250" y="274" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">Teclado, contraste, no solo el color.</text>
<rect x="40" y="302" width="800" height="48" rx="10" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="60" y="332" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Seguridad</text>
<text x="250" y="332" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">El navegador es la máquina de la persona.</text>
</svg>
