<text x="160" y="282" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Backend</text>
<text x="340" y="282" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">API: la pregunta admitida</text>
<rect x="140" y="312" width="600" height="52" rx="10" fill="#d5ead6" stroke="#2f6b3a" stroke-width="2"/>
