<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
<title>Capas: persona, navegador con React, middleware, backend y fuentes de datos.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<text x="440" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">De la persona al dato</text>
<rect x="140" y="64" width="600" height="52" rx="10" fill="#f8e6b0" stroke="#8d6a12" stroke-width="2"/>
<text x="160" y="96" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Persona</text>
<text x="340" y="96" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">mira, filtra, decide</text>
<rect x="140" y="126" width="600" height="52" rx="10" fill="#d5e4f7" stroke="#2c5f94" stroke-width="2"/>
<text x="160" y="158" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Navegador</text>
<text x="340" y="158" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">React describe la pantalla</text>
<rect x="140" y="188" width="600" height="52" rx="10" fill="#e7e2d8" stroke="#6f675c" stroke-width="2"/>
<text x="160" y="220" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Middleware</text>
