<text x="76" y="192" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">L2   Retraso leve</text>
<rect x="60" y="216" width="320" height="40" rx="8" fill="#f8e6b0" stroke="#8d6a12" stroke-width="1.5"/>
<text x="76" y="242" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">B12   Interrumpida</text>
<rect x="500" y="116" width="320" height="40" rx="8" fill="#f6d5ce" stroke="#9a4638" stroke-width="1.5"/>
<text x="516" y="142" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">L2   Retraso leve</text>
<rect x="500" y="166" width="320" height="40" rx="8" fill="#f6d5ce" stroke="#9a4638" stroke-width="1.5"/>
<text x="516" y="192" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">B12   Interrumpida</text>
<text x="660" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">L1 ya no sale.</text>
<text x="660" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">No se borró a mano.</text>
<line x1="410" y1="180" x2="468" y2="180" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="440" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Cambia el recuerdo. Se vuelve a describir la lista. La fila es la misma pieza, con menos datos.</text>
