<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img">
<title>React en el centro: los datos entran, la pantalla sale. Node, el servidor y la base de datos quedan alrededor.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="36" y="150" width="200" height="78" rx="10" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/><text x="52" y="178" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Datos</text><text x="52" y="200" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">líneas, estados, alarmas</text>
<line x1="246" y1="189" x2="300" y2="189" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="308" y="118" width="250" height="142" rx="16" fill="#d5e4f7" stroke="#2c5f94" stroke-width="2.5"/>
<text x="433" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e2430">React</text>
<text x="433" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a5f">piezas que describen</text>
<text x="433" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e3a5f">la pantalla</text>
<line x1="568" y1="189" x2="622" y2="189" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="630" y="150" width="214" height="78" rx="10" fill="#f8e6b0" stroke="#8d6a12" stroke-width="2"/><text x="646" y="178" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Pantalla</text><text x="646" y="200" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">lo que la persona ve</text>
<rect x="36" y="330" width="808" height="110" rx="14" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="56" y="368" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Alrededor, sin ser React</text>
<text x="56" y="398" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Node y NPM preparan los archivos. El servidor web los entrega. La base de datos guarda la verdad.</text>
<text x="56" y="422" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Angular y Vue ocupan el mismo hueco: describir la interfaz. Un marco (Next, Gatsby, Remix) decide dónde nace el HTML.</text>
<text x="440" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">React es la pieza del medio</text>
<text x="440" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">De los datos sale la pantalla. La pantalla no es un segundo original.</text>
</svg>
