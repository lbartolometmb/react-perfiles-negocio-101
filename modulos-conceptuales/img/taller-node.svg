<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img">
<title>Del código fuente al servidor web: Node y NPM construyen los archivos que el navegador sabe abrir.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="24" y="118" width="168" height="130" rx="14" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="108" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Fuente</text>
<text x="108" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">componentes,</text>
<text x="108" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">configuración</text>
<line x1="200" y1="183" x2="266" y2="183" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="250" y="118" width="168" height="130" rx="14" fill="#d5e4f7" stroke="#2c5f94" stroke-width="2"/>
<text x="334" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Node y NPM</text>
<text x="334" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">taller que ensambla</text>
<text x="334" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">las piezas</text>
<line x1="426" y1="183" x2="492" y2="183" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="476" y="118" width="168" height="130" rx="14" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="560" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Resultado</text>
<text x="560" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">HTML, CSS y JS</text>
<text x="560" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">que el navegador lee</text>
<line x1="652" y1="183" x2="718" y2="183" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="702" y="118" width="168" height="130" rx="14" fill="#fffdf8" stroke="#6f675c" stroke-width="2"/>
<text x="786" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Servidor web</text>
<text x="786" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">entrega esos</text>
<text x="786" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">archivos</text>
<text x="440" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">Antes de publicarse hay un taller</text>
<text x="440" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Lo que se despliega es el resultado, no la estantería de carpetas del proyecto.</text>
<text x="440" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">NPM es el catálogo de piezas de ese taller. Node es quien lo ejecuta.</text>
</svg>
