<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img">
<title>Señales de alerta: un fichero enorme, textos copiados, datos duplicados y un marco que no responde al problema.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<text x="440" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2430">Cuatro señales de alerta</text>
<rect x="40" y="76" width="800" height="66" rx="12" fill="#fffdf8" stroke="#9a4638" stroke-width="2"/>
<rect x="40" y="76" width="10" height="66" rx="4" fill="#9a4638"/>
<text x="70" y="104" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Un solo fichero</text>
<text x="70" y="126" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">La pantalla, la regla de negocio y la llamada al servidor viven juntos.</text>
<rect x="40" y="154" width="800" height="66" rx="12" fill="#fffdf8" stroke="#9a4638" stroke-width="2"/>
<rect x="40" y="154" width="10" height="66" rx="4" fill="#9a4638"/>
<text x="70" y="182" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">El letrero copiado</text>
<text x="70" y="204" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">«En servicio» está escrito en diez sitios. Cambiará en nueve.</text>
<rect x="40" y="232" width="800" height="66" rx="12" fill="#fffdf8" stroke="#9a4638" stroke-width="2"/>
<rect x="40" y="232" width="10" height="66" rx="4" fill="#9a4638"/>
<text x="70" y="260" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Dos verdades</text>
<text x="70" y="282" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">La lista dice tres y un contador guardado dice cuatro.</text>
<rect x="40" y="310" width="800" height="66" rx="12" fill="#fffdf8" stroke="#9a4638" stroke-width="2"/>
<rect x="40" y="310" width="10" height="66" rx="4" fill="#9a4638"/>
<text x="70" y="338" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Marco de más</text>
<text x="70" y="360" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Gatsby para una pared de alarmas en vivo, o Electron para abrir una URL.</text>
</svg>
